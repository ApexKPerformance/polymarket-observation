# Tracked Polymarket events.
#
# Each entry references a Polymarket "event" (a question with N sub-markets).
# The poller resolves event slug -> sub-markets at startup and inserts them
# into the `markets` SQLite table. From then on it polls each sub-market.
#
# Adding a market: append an entry here. Removing one: set active: false
# (do NOT delete -- we want the historical snapshots to remain queryable).
#
# `track:` marks which sub-market(s) belong in the Notion Observation Log.
# Everything else on the board is still polled into the tape -- we want the
# full board for context -- it just does not get a Notion row. A sub-market
# with a notion_page_id is bound to the row that already exists in the log;
# without one, the sync creates a new row on first run.
#
# Verify the bindings before syncing:  python -m src.notion_sync --link-report

